name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/helio-backend:latest ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/helio-backend:latest

      - name: Build and push Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/helio-frontend:latest ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/helio-frontend:latest

      - name: Copy docker-compose via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/HelioMed"

      - name: SSH and Restart target Docker containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Passes Docker Hub username secret into .env for the docker-compose file
          script: |
            cd ~/HelioMed
            echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" > .env
            docker-compose pull
            docker-compose up -d --remove-orphans
