name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/helio-backend:latest ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/helio-backend:latest

      - name: Build and push Frontend Image
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --build-arg VITE_NEON_AUTH_URL=${{ secrets.VITE_NEON_AUTH_URL }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/helio-frontend:latest ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/helio-frontend:latest

      - name: Copy docker-compose via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/HelioMed"

      - name: SSH and Restart target Docker containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu

            wait_for_http() {
              url="$1"
              attempts="$2"
              i=1
              while [ "$i" -le "$attempts" ]; do
                if curl -fsS "$url" >/dev/null; then
                  echo "Healthy: $url"
                  return 0
                fi
                echo "Waiting for $url ($i/$attempts)"
                sleep 3
                i=$((i + 1))
              done
              echo "Health check failed: $url"
              return 1
            }

            cd ~/HelioMed
            echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" > .env
            
            # Create backend .env file securely on the server
            mkdir -p backend
            cat > backend/.env << 'EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            CORS_ORIGINS=["http://${{ secrets.EC2_HOST }}","https://${{ secrets.EC2_HOST }}","http://${{ secrets.EC2_HOST }}:3000","https://${{ secrets.EC2_HOST }}:3000"]
            EOF

            docker-compose pull
            docker-compose up -d --remove-orphans
            
            # Wait for backend to be ready, then run DB migrations
            sleep 5
            if ! sudo docker exec helio-backend alembic upgrade head; then
              sudo docker logs helio-backend --tail 200 || true
              exit 1
            fi

            if ! wait_for_http http://localhost:3000/health 20; then
              sudo docker logs helio-frontend --tail 200 || true
              sudo docker logs helio-backend --tail 200 || true
              exit 1
            fi

            if ! wait_for_http http://localhost:3000/health/db 20; then
              sudo docker logs helio-backend --tail 200 || true
              exit 1
            fi
